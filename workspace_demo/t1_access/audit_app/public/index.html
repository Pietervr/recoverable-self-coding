<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Clue Check</title>
<style>
:root {
  --bg: #f7f6f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1d9;
  --accent: #2f6f4f; --accent-ink: #ffffff; --flag: #b4532a; --flag-bg: #fbeee7;
  --ok-bg: #e8f3ec; --warn-bg: #fff6d6; --focus: #2f6f4f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171716; --card: #222220; --ink: #ecebe6; --muted: #a3a29b; --line: #3a3935;
    --accent: #6fbf92; --accent-ink: #0f1a14; --flag: #f0946a; --flag-bg: #3a261d;
    --ok-bg: #1e3327; --warn-bg: #3a331a; --focus: #6fbf92;
  }
}
:root[data-theme="dark"] {
  --bg: #171716; --card: #222220; --ink: #ecebe6; --muted: #a3a29b; --line: #3a3935;
  --accent: #6fbf92; --accent-ink: #0f1a14; --flag: #f0946a; --flag-bg: #3a261d;
  --ok-bg: #1e3327; --warn-bg: #3a331a; --focus: #6fbf92;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 0 16px 96px; }
h1 { font-size: 1.6rem; margin: 28px 0 4px; }
h2 { font-size: 1.15rem; margin: 0 0 8px; }
.box h3 { font-size: 1rem; margin: 14px 0 4px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 16px 0; }
details.box > summary { cursor: pointer; font-weight: 600; }
details.box[open] > summary { margin-bottom: 10px; }
ul.tight { margin: 0 0 12px; padding-left: 20px; }
ul.tight li { margin: 2px 0; }
.ex { font-size: .95rem; }
.ex td { padding: 3px 10px 3px 0; vertical-align: top; }
.ex td:last-child { white-space: nowrap; font-weight: 600; }

#bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 8px 16px; }
#bar .in { max-width: 760px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
#bar .counts { font-size: .9rem; flex: 1 1 220px; }
#bar .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
#bar .fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
#status { font-size: .85rem; color: var(--muted); min-width: 90px; text-align: right; }
#status.bad { color: var(--flag); font-weight: 600; }

button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); padding: 6px 11px; min-height: 36px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button[disabled] { opacity: .45; cursor: default; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 18px 0; overflow: hidden; }
.card > header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card > header .word { font-size: 1.3rem; font-weight: 700; }
.card > header .fam { font-size: .85rem; color: var(--muted); }
.card > header .left { margin-left: auto; font-size: .85rem; color: var(--muted); }
.card > footer { padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.row { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.row.done { background: var(--ok-bg); }
.row.flagged { background: var(--flag-bg); }
.row.hl { box-shadow: inset 4px 0 0 var(--accent); }
.row .txt { margin-bottom: 8px; }
.row .txt::before { content: "\2013\00a0"; color: var(--muted); }
.tag { display: inline-block; font-size: .8rem; border-radius: 6px; padding: 1px 7px; margin: 0 6px 6px 0; }
.tag.allow { background: var(--warn-bg); }
.tag.note { background: var(--warn-bg); display: block; margin-right: 0; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btns .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.btns button.fine[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btns button.flag[aria-pressed="true"] { background: var(--flag); color: #fff; border-color: var(--flag); }
.cmt { margin-top: 8px; display: none; }
.cmt.show { display: block; }
.cmt input { width: 100%; font: inherit; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); }

#next { position: fixed; right: 16px; bottom: 16px; z-index: 6; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
#done { display: none; }
.err { color: var(--flag); }
</style>
</head>
<body>
<div id="bar" hidden>
  <div class="in">
    <div class="counts"><span id="counts"></span><div class="track"><div class="fill" id="fill"></div></div></div>
    <div id="status" aria-live="polite">Saved</div>
  </div>
</div>
<main id="app">
  <h1>Clue Check</h1>
  <p class="muted" id="loading">Loading your part&hellip;</p>
</main>
<button id="next" class="primary" hidden>Next unchecked &darr;</button>

<script>
(() => {
  const token = (location.pathname.match(/\/r\/([A-Za-z0-9_-]+)/) || [])[1]
    || new URLSearchParams(location.search).get('t') || '';
  const app = document.getElementById('app');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Each visitor gets a private, anonymous session, so people who share a link keep their own answers.
  // It comes from the personal link (?s=), else from this browser, else it is made now; it is kept in both.
  const SID_RE = /^[A-Za-z0-9_-]{16,40}$/;
  const sidKey = 'audit_sid_' + token;
  let sid = new URLSearchParams(location.search).get('s') || '';
  if (!SID_RE.test(sid)) { try { sid = localStorage.getItem(sidKey) || ''; } catch (e) { sid = ''; } }
  if (!SID_RE.test(sid)) {
    const a = new Uint8Array(18);
    crypto.getRandomValues(a);
    sid = btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  try { localStorage.setItem(sidKey, sid); } catch (e) { /* private window: the personal link still works */ }
  const personal = location.origin + '/r/' + token + '?s=' + sid;
  if (token) history.replaceState(null, '', '/r/' + token + '?s=' + sid);

  let items = [], marks = {};
  const rows = new Map();          // id -> {el, item, card}
  const cards = [];                // {el, ids, word, leftEl, restBtn}
  let current = null;              // the card the visitor last worked on, shown in the top bar

  // ---------- saving: one request at a time, retried until the server has it ----------
  const queue = [];
  let busy = false, failed = false;
  const statusEl = document.getElementById('status');
  function setStatus() {
    statusEl.classList.toggle('bad', failed);
    statusEl.textContent = failed ? 'Not saved: retrying…' : (queue.length ? 'Saving…' : 'Saved');
  }
  function enqueue(url, body) { queue.push({ url, body }); setStatus(); pump(); }
  async function pump() {
    if (busy) return;
    busy = true;
    while (queue.length) {
      const req = queue[0];
      try {
        const r = await fetch(req.url, { method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify(req.body) });
        if (r.status >= 400 && r.status < 500) {
          const e = await r.json().catch(() => ({}));
          queue.shift();
          failed = false;
          statusEl.textContent = 'Could not save (' + (e.error || r.status) + '). Please reload the page.';
          statusEl.classList.add('bad');
          continue;
        }
        if (!r.ok) throw new Error(String(r.status));
        queue.shift();
        failed = false;
      } catch (e) {
        failed = true;
        setStatus();
        await sleep(3000);
      }
      setStatus();
    }
    busy = false;
  }
  window.addEventListener('beforeunload', (ev) => { if (queue.length) { ev.preventDefault(); ev.returnValue = ''; } });

  // ---------- mark semantics ----------
  // A clause mark: t (true: y|n|?), nm (names it: y|n), d (gives it away alone: y|n), c (comment).
  // A question mark: ok (both answers right: y|n), un (beyond dispute: y|n), c.
  const isClue = (id) => id.startsWith('c-');
  function flagsOf(id) {
    const m = marks[id];
    if (!m) return null;
    if (isClue(id)) return { notTrue: m.t === 'n', unsure: m.t === '?', names: m.nm === 'y', gives: m.d === 'y' };
    return { wrong: m.ok === 'n', depends: m.un === 'n' };
  }
  const anyFlag = (f) => !!f && Object.values(f).some(Boolean);
  function markFromFlags(id, f, c) {
    if (isClue(id)) return { t: f.notTrue ? 'n' : f.unsure ? '?' : 'y', nm: f.names ? 'y' : 'n', d: f.gives ? 'y' : 'n', c };
    return { ok: f.wrong ? 'n' : 'y', un: f.depends ? 'n' : 'y', c };
  }
  const fineMark = (id, c) => isClue(id) ? { t: 'y', nm: 'n', d: 'n', c } : { ok: 'y', un: 'y', c };

  function setMark(id, m, via = 'row') {
    if (m) marks[id] = m; else delete marks[id];
    enqueue('/api/mark', { t: token, s: sid, id, m: m || {}, via });
    current = rows.get(id).card;
    paintRow(id);
  }

  // ---------- rendering ----------
  const FLAGS_CLUE = [['notTrue', 'Not true'], ['unsure', 'Not sure it’s true'], ['names', 'Names it'], ['gives', 'Gives it away']];
  const FLAGS_Q = [['wrong', 'An answer is wrong'], ['depends', 'It depends / arguable']];

  function rowHTML(it) {
    const flags = isClue(it.id) ? FLAGS_CLUE.filter(([k]) => !(k === 'gives' && it.allowed)) : FLAGS_Q;
    let head;
    if (isClue(it.id)) {
      head = '<div class="txt">' + esc(it.clause) + '</div>'
        + (it.allowed ? '<span class="tag allow">One of the two lines allowed to give it away</span>' : '')
        + (it.note ? '<span class="tag note">⚑ Please check this fact carefully</span>' : '');
    } else {
      head = '<div class="txt"><strong>' + esc(it.question) + '</strong></div>'
        + '<p class="muted" style="margin:0 0 8px">For <strong>' + esc(it.concept) + '</strong> the answer is <strong>'
        + esc(it.a_concept) + '</strong>. For <strong>' + esc(it.foil) + '</strong> it is <strong>' + esc(it.a_foil) + '</strong>.</p>'
        + (it.note ? '<span class="tag note">⚑ Please check this fact carefully</span>' : '');
    }
    const fineLabel = isClue(it.id) ? 'Fine' : 'Both right, no doubt';
    return head + '<div class="btns"><button class="fine" aria-pressed="false">✓ ' + fineLabel + '</button><span class="sep"></span>'
      + flags.map(([k, l]) => '<button class="flag" data-f="' + k + '" aria-pressed="false">' + l + '</button>').join('')
      + '</div><div class="cmt"><input type="text" maxlength="1000" placeholder="What’s wrong, or a better wording (optional)" aria-label="Note"></div>';
  }

  function paintRow(id) {
    const r = rows.get(id);
    if (!r) return;
    const m = marks[id], f = flagsOf(id), flagged = anyFlag(f);
    r.el.classList.toggle('done', !!m && !flagged);
    r.el.classList.toggle('flagged', flagged);
    r.el.querySelector('button.fine').setAttribute('aria-pressed', String(!!m && !flagged));
    r.el.querySelectorAll('button.flag').forEach((b) => b.setAttribute('aria-pressed', String(!!f && !!f[b.dataset.f])));
    const cmt = r.el.querySelector('.cmt');
    cmt.classList.toggle('show', flagged || !!(m && m.c));
    const inp = cmt.querySelector('input');
    if (document.activeElement !== inp) inp.value = (m && m.c) || '';
    paintCard(r.card);
    paintProgress();
  }

  function paintCard(card) {
    if (!card) return;
    const left = card.ids.filter((id) => !marks[id]).length, n = card.ids.length;
    card.leftEl.textContent = left ? (n - left) + ' of ' + n + ' checked' : 'all ' + n + ' checked \u2713';
    card.restBtn.disabled = left === 0;
    card.restBtn.textContent = left ? 'The other ' + left + ' ' + (left === 1 ? 'is' : 'are') + ' fine' : 'All checked';
  }

  function paintProgress() {
    const clues = items.filter((i) => isClue(i.id)), qs = items.filter((i) => !isClue(i.id));
    const dc = clues.filter((i) => marks[i.id]).length, dq = qs.filter((i) => marks[i.id]).length;
    // Say what has been done, never how much is left: the bar shows the proportion.
    const finished = cards.filter((c) => c.ids.every((id) => marks[id])).length;
    const parts = [];
    if (current) parts.push(current.word + ': ' + current.ids.filter((id) => marks[id]).length + ' of ' + current.ids.length);
    parts.push((dc + dq) + ' checked in all');
    if (finished) parts.push(finished + (finished === 1 ? ' card' : ' cards') + ' finished');
    document.getElementById('counts').textContent = (dc + dq)
      ? parts.join('  \u00b7  ') : 'Nothing checked yet: start with the first card below';
    const all = items.length ? (dc + dq) / items.length : 0;
    document.getElementById('fill').style.width = (100 * all).toFixed(1) + '%';
    const complete = items.length > 0 && dc + dq === items.length;
    document.getElementById('done').style.display = complete ? 'block' : 'none';
    document.getElementById('next').hidden = complete;
  }

  function wireRow(el, it, card) {
    const id = it.id;
    rows.set(id, { el, item: it, card });
    el.querySelector('button.fine').addEventListener('click', () => {
      const f = flagsOf(id), m = marks[id];
      if (m && !anyFlag(f)) setMark(id, null);                       // un-click Fine
      else setMark(id, fineMark(id, (m && m.c) || ''));
    });
    el.querySelectorAll('button.flag').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.f;
      const f = Object.assign({}, flagsOf(id) || {});
      f[k] = !f[k];
      if (k === 'notTrue' && f.notTrue) f.unsure = false;
      if (k === 'unsure' && f.unsure) f.notTrue = false;
      const c = (marks[id] && marks[id].c) || '';
      setMark(id, anyFlag(f) ? markFromFlags(id, f, c) : null);
      if (anyFlag(f)) el.querySelector('.cmt input').focus({ preventScroll: true });
    }));
    let t = null;
    el.querySelector('.cmt input').addEventListener('input', (ev) => {
      clearTimeout(t);
      const v = ev.target.value;
      t = setTimeout(() => {
        const m = marks[id];
        if (!m) return;                                                // a note needs a mark to hang on
        setMark(id, Object.assign({}, m, { c: v }));
      }, 700);
    });
  }

  function render(state) {
    items = state.items;
    marks = {};
    for (const [id, x] of Object.entries(state.marks)) marks[id] = x.m;

    const clueItems = items.filter((i) => isClue(i.id)), qItems = items.filter((i) => !isClue(i.id));
    const minutes = Math.round((clueItems.length * 5 + qItems.length * 15) / 60 / 5) * 5;

    app.innerHTML = `
      <h1>Clue Check</h1>
      <p class="muted">Thank you for helping. This is part ${esc(state.slot)} of 4 of the check. Do as much as you have time for:
      every line you check counts, and the cards at the top are the ones the fewest people have checked so far.</p>
      <p><strong>There are no right or wrong answers.</strong> This is not a test of you: we are checking the descriptions
      themselves, above all that none of them makes it obvious on its own what the hidden thing is. Your honest first
      impression is exactly what we need.</p>
      <div class="box" style="padding:12px 16px">
        <p style="margin:0 0 6px">Your answers save as you click. To carry on later, just reopen this page in the same browser.
        On another device, use your personal link:</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="plink" type="text" readonly style="flex:1 1 240px;min-width:0;font:inherit;
        padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"
        value="${esc(personal)}" aria-label="Your personal link"><button id="pcopy">Copy</button></div>
      </div>

      <section class="box">
        <h2>What this is for</h2>
        <p>This check is part of a research project on a question that is now asked of artificial intelligence as well as of the
        brain: when something reaches awareness, how does it get there?</p>
        <h3>The question</h3>
        <p>Think of glimpsing a faint shape in the dark. At first you see nothing; a moment later, you see it. What happens in between
        is still argued over. On one view, awareness fades in gradually as the evidence grows. On another, the brain gathers evidence
        quietly and then, at a threshold, commits to it and makes it available all at once, to memory, to speech and to decisions.
        Experiments that show people faint pictures or words at the edge of visibility have been read both ways, partly because the
        answer depends on exactly how the data are analysed.</p>
        <h3>Why an AI model</h3>
        <p>AI language models, the systems behind chatbots, now do many things that once seemed to need a mind, and it is reasonable to
        ask whether anything like that threshold happens inside them. We do not assume the answer either way, and this project does not
        claim that any AI is aware. It asks a narrower question that can be measured: as the evidence for something builds up, does the
        model's internal state change smoothly, or does it switch between two distinct states? The model is analysed with the same method
        we apply to published brain recordings, so that the two can be compared on equal terms.</p>
        <h3>How the test works</h3>
        <p>The model reads a list of eight short lines. Some describe a hidden thing, say an owl, and the rest describe other, unrelated
        things. We vary how many lines point to the hidden thing, from none to all eight, and record what happens inside the model at each
        step: a gradual shift, or a jump.</p>
        <h3>Why we need you</h3>
        <p>The test is only as good as its descriptions. A line that is false, that quietly contains the answer, or that gives it away on
        its own would make the result meaningless. The descriptions were drafted by an AI model, and an AI should not be the only judge of
        its own work. So every line is checked by people, like you, and separately by a second AI model from a different company. Where
        anyone finds a problem, the line is fixed or dropped before the experiment runs.</p>
        <p class="muted" style="margin:0">Your answers are anonymous and are used only to fix or drop descriptions; the study and these
        checks will be described in a scientific paper. Thank you. Pieter van Rooyen, Stellenbosch University</p>
      </section>

      <details class="box" open>
        <summary>What to check (1 minute to read)</summary>
        <p>Each card shows one thing and twelve descriptions of it. For each description, check that:</p>
        <ul class="tight">
          <li><strong>It is true</strong> of the thing, as an ordinary person understands the word.</li>
          <li><strong>It does not name it.</strong> No form of the word (plural, translation, pun, part of a longer word) and no
          category word such as “animal”, “country” or “instrument”.</li>
          <li><strong>It does not give it away on its own.</strong> Someone reading that one line alone should not be able to say
          what it is; it should take two or three lines together. Up to two lines per thing are allowed to give it away, and they are
          labelled.</li>
        </ul>
        <p>If all three hold, click <strong>✓ Fine</strong>. If not, click what’s wrong (more than one is allowed) and, if
        you like, type a note. A few lines carry the flag <em>⚑ Please check this fact carefully</em>: whoever wrote the descriptions was not
        sure of that fact. The flag is the same for everyone; it is not another reader’s answer. When the rest of a card is fine, one click on <strong>The other … are fine</strong> marks them all.</p>
        <table class="ex"><tbody>
          <tr><td colspan="2" class="muted">Example, for <strong>owl</strong> (not in the list):</td></tr>
          <tr><td>hunts small creatures in the dark</td><td>Fine</td></tr>
          <tr><td>lives its whole life underwater</td><td>Not true</td></tr>
          <tr><td>is a night animal with soft feathers</td><td>Names it (“animal”)</td></tr>
          <tr><td>is the bird that hoots at night</td><td>Gives it away</td></tr>
        </tbody></table>
        <p style="margin-top:12px">At the end are ${qItems.length} yes/no questions, each with its correct answers for two things.
        Click <strong>✓ Both right, no doubt</strong> if both answers are correct and nobody would dispute them.</p>
        <ul class="tight muted" style="margin-bottom:0">
          <li>About ${minutes} minutes for the whole part, but any amount helps. Every click saves at once; stop whenever you like.</li>
          <li>Please work on your own and don’t compare answers with other readers.</li>
          <li>No name or email is recorded: your answers are anonymous.</li>
        </ul>
      </details>

      <div id="cards"></div>
      <section class="box" id="done"><h2>All done, thank you!</h2><p style="margin:0">Everything is saved. You can still change any answer
      on this page until Pieter closes the check.</p></section>`;

    const host = document.getElementById('cards');
    const groups = [];
    for (const it of clueItems) {
      const g = groups[groups.length - 1];
      if (g && g.key === it.key) g.items.push(it); else groups.push({ key: it.key, word: it.concept, fam: it.family, items: [it] });
    }
    if (qItems.length) groups.push({ key: 'questions', word: 'Yes/no questions', fam: '', items: qItems });

    for (const g of groups) {
      const card = document.createElement('section');
      card.className = 'card';
      card.innerHTML = '<header><span class="word">' + esc(g.word) + '</span>'
        + (g.fam ? '<span class="fam">' + esc(g.fam) + '</span>' : '') + '<span class="left"></span></header>';
      const rec = { el: card, ids: g.items.map((i) => i.id), word: g.key === 'questions' ? 'Questions' : g.word };
      for (const it of g.items) {
        const row = document.createElement('div');
        row.className = 'row';
        row.dataset.id = it.id;
        row.innerHTML = rowHTML(it);
        card.appendChild(row);
        wireRow(row, it, rec);
      }
      const foot = document.createElement('footer');
      foot.innerHTML = '<button class="rest"></button>';
      card.appendChild(foot);
      rec.leftEl = card.querySelector('.left');
      rec.restBtn = foot.querySelector('button.rest');
      rec.restBtn.addEventListener('click', () => {
        const todo = rec.ids.filter((id) => !marks[id]);
        if (!todo.length) return;
        const batch = todo.map((id) => ({ id, m: fineMark(id, '') }));
        for (const x of batch) marks[x.id] = x.m;
        current = rec;
        enqueue('/api/bulk', { t: token, s: sid, marks: batch, via: 'card' });
        for (const id of todo) paintRow(id);
      });
      cards.push(rec);
      host.appendChild(card);
    }
    for (const id of rows.keys()) paintRow(id);
    for (const c of cards) paintCard(c);
    paintProgress();
    document.getElementById('bar').hidden = false;
    document.getElementById('pcopy').addEventListener('click', async (ev) => {
      const inp = document.getElementById('plink');
      try { await navigator.clipboard.writeText(inp.value); } catch (e) { inp.select(); document.execCommand('copy'); }
      ev.target.textContent = 'Copied';
      setTimeout(() => { ev.target.textContent = 'Copy'; }, 1500);
    });
  }

  document.getElementById('next').addEventListener('click', () => {
    const it = items.find((i) => !marks[i.id]);
    if (!it) return;
    const r = rows.get(it.id);
    document.querySelectorAll('.row.hl').forEach((e) => e.classList.remove('hl'));
    r.el.classList.add('hl');
    r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  async function start() {
    if (!token) { app.innerHTML = '<h1>Clue Check</h1><p class="err">This page needs your personal link. Please use the link Pieter sent you.</p>'; return; }
    try {
      const r = await fetch('/api/state?t=' + encodeURIComponent(token) + '&s=' + encodeURIComponent(sid), { cache: 'no-store' });
      if (r.status === 404) { app.innerHTML = '<h1>Clue Check</h1><p class="err">This link is not valid. Please check it against the one Pieter sent you.</p>'; return; }
      if (!r.ok) throw new Error(String(r.status));
      render(await r.json());
    } catch (e) {
      app.innerHTML = '<h1>Clue Check</h1><p class="err">Could not load your part (' + esc(e.message) + '). Please check your connection and reload.</p>';
    }
  }
  start();
})();
</script>
</body>
</html>
